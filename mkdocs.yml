site_name: Abdoulhakim ELMI MAHAMOUD
site_description: Portfolio professionnel en geomatique, Web SIG, cartographie et developpement web
site_author: Abdoulhakim ELMI MAHAMOUD
site_url: https://abdoulhakimelmi-lang.github.io/abdoulhakimelmi-lang/

repo_name: abdoulhakimelmi-lang/abdoulhakimelmi-lang
repo_url: https://github.com/abdoulhakimelmi-lang/abdoulhakimelmi-lang
edit_uri: edit/main/docs/

theme:
  name: material
  language: fr
  logo: assets/logo.svg
  favicon: assets/logo.svg
  features:
    - navigation.sections
    - navigation.expand
    - navigation.top
    - toc.integrate
    - search.highlight
    - search.suggest
    - content.action.edit
    - content.code.copy
  palette:
    - scheme: default
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-night
        name: Mode sombre
    - scheme: slate
      primary: teal
      accent: deep orange
      toggle:
        icon: material/weather-sunny
        name: Mode clair
  font:
    text: Inter
    code: JetBrains Mono

nav:
  - Accueil: index.md
  - CV:
      - Vue generale: cv/index.md
      - Formation: cv/formation.md
      - Certifications: cv/certifications.md
  - Experiences:
      - Vue generale: experiences/index.md
      - DIR Est - Nancy: experiences/dir-est.md
      - ARULoS - Djibouti: experiences/arulos.md
      - Projet tuteure: experiences/projet-tuteure.md
  - Competences:
      - Vue generale: competences/index.md
      - SIG et cartographie: competences/sig-cartographie.md
      - Bases de donnees spatiales: competences/bases-donnees-spatiales.md
      - Web SIG: competences/web-sig.md
      - Python et automatisation: competences/python-automatisation.md
      - Teledetection et raster: competences/teledetection-raster.md
      - FME et interoperabilite: competences/fme-interoperabilite.md
  - Projets:
      - Vue generale: projets/index.md
      - Web SIG et cartographie: projets/web-sig-cartographie.md
      - Bases de donnees: projets/bases-donnees.md
      - Documentation technique: projets/documentation-technique.md
  - Contact: contact.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/abdoulhakimelmi-lang
    - icon: fontawesome/solid/envelope
      link: mailto:ing.abdoulhakim.elmi@gmail.com

extra_css:
  - stylesheets/extra.css

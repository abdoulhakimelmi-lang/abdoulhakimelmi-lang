site_name: Plateforme de documentation en Geomatique
site_description: Portfolio professionnel en geomatique, Web SIG, cartographie et developpement web
site_author: Abdoulhakim ELMI MAHAMOUD
site_url: https://abdoulhakimelmi-lang.github.io/abdoulhakimelmi-lang/

repo_name: abdoulhakimelmi-lang/abdoulhakimelmi-lang
repo_url: https://github.com/abdoulhakimelmi-lang/abdoulhakimelmi-lang
edit_uri: ""

theme:
  name: readthedocs
  language: fr
  navigation_depth: 4
  collapse_navigation: false
  titles_only: false
  sticky_navigation: true
  prev_next_buttons_location: bottom
  highlightjs: true

nav:
  - Accueil: index.md
  - CV:
      - Vue generale: cv/index.md
      - Formation: cv/formation.md
      - Certifications: cv/certifications.md
  - Experiences:
      - Vue generale: experiences/index.md
      - DIR Est - Nancy: experiences/dir-est.md
      - ARULoS - Djibouti: experiences/arulos.md
      - Projet tuteure: experiences/projet-tuteure.md
  - Competences:
      - Vue generale: competences/index.md
      - SIG et cartographie: competences/sig-cartographie.md
      - Bases de donnees spatiales: competences/bases-donnees-spatiales.md
      - Web SIG: competences/web-sig.md
      - Python et automatisation: competences/python-automatisation.md
      - Teledetection et raster: competences/teledetection-raster.md
      - FME et interoperabilite: competences/fme-interoperabilite.md
  - Projets:
      - Vue generale: projets/index.md
      - Web SIG et cartographie: projets/web-sig-cartographie.md
      - Bases de donnees: projets/bases-donnees.md
      - Documentation technique: projets/documentation-technique.md
  - Contact: contact.md

markdown_extensions:
  - attr_list
  - md_in_html
  - admonition
  - tables
  - toc:
      permalink: true

plugins:
  - search

extra_css:
  - stylesheets/extra.css
